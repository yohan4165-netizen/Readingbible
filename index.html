<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 리딩바이블</title>
<meta name="description" content="새중앙침례교회 리딩바이블 매일성경통독큐티 자료">
<meta property="og:type" content="website">
<meta property="og:site_name" content="오늘의 리딩바이블">
<meta property="og:title" content="오늘의 리딩바이블">
<meta property="og:description" content="새중앙침례교회 리딩바이블 매일성경통독큐티 자료">
<meta property="og:url" content="https://yohan4165-netizen.github.io/Readingbible/">
<meta property="og:image" content="https://yohan4165-netizen.github.io/Readingbible/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://yohan4165-netizen.github.io/Readingbible/og-image.jpg">
<meta name="theme-color" content="#9a5b2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="리딩바이블">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2622; --muted:#8a7f72; --line:#e6dccb;
    --accent:#9a5b2e; --accent-soft:#f3e6d6; --verse:#5a4636;
    --fs:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17140f; --paper:#201c16; --ink:#ebe3d6; --muted:#9c907f; --line:#3a3229;
           --accent:#e0a36c; --accent-soft:#2f261c; --verse:#e8d2b8; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
       padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
         backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:60px}
  .nav{width:44px;height:44px;border:0;background:none;color:var(--ink);font-size:22px;border-radius:50%;cursor:pointer}
  .nav:active{background:var(--accent-soft)}
  .when{text-align:center;cursor:pointer;user-select:none}
  .when small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted)}
  .when b{font-size:17px;font-weight:700}
  .when .today-pill{display:inline-block;margin-left:6px;font-size:10px;padding:2px 7px;border-radius:99px;
                    background:var(--accent);color:var(--paper);vertical-align:2px}

  main{padding-top:22px}
  .ref{font-family:"Noto Serif KR",serif;font-size:13px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin:0 0 6px}
  h1{font-family:"Noto Serif KR",serif;font-size:calc(var(--fs) + 9px);line-height:1.35;margin:0 0 22px;font-weight:700;word-break:keep-all}

  .verses{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);
          border-radius:14px;padding:20px 22px;margin:0 0 30px}
  .verse{font-family:"Noto Serif KR",serif;font-size:calc(var(--fs) + 1px);line-height:1.85;color:var(--verse);
         margin:0;word-break:keep-all}
  .verse + .verse{margin-top:10px}
  .verse sup{font-family:"Noto Sans KR",sans-serif;font-size:.62em;color:var(--accent);font-weight:700;margin-right:6px;vertical-align:.45em}

  .body p{font-size:var(--fs);line-height:1.95;margin:0 0 1.35em;word-break:keep-all;text-indent:.6em}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.2em;margin:34px 0 18px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .question{background:var(--accent-soft);border-radius:16px;padding:22px 22px 20px;margin:8px 0 26px}
  .question .tag{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:8px}
  .question p{font-family:"Noto Serif KR",serif;font-size:calc(var(--fs) + 1px);line-height:1.8;margin:0;font-weight:600;word-break:keep-all}

  .files{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 13px;border-radius:99px;
        border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--paper)}
  .src{font-size:12px;color:var(--muted);margin-top:14px}
  .src a{color:var(--muted)}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
        background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        border-top:1px solid var(--line)}
  .dock .wrap{display:flex;gap:8px;padding:0 4px}
  .btn{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
       font:500 15px "Noto Sans KR",sans-serif;cursor:pointer}
  .btn.primary{flex:2.2;background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
  .btn.sm{flex:.8;font-size:14px}
  .btn:disabled{opacity:.45}

  .state{text-align:center;padding:70px 10px;color:var(--muted);line-height:1.8}
  .state .big{font-size:40px;margin-bottom:10px}
  .skel{background:linear-gradient(90deg,var(--line) 25%,var(--paper) 50%,var(--line) 75%);background-size:200% 100%;
        animation:sh 1.3s infinite;border-radius:8px;height:16px;margin:12px 0}
  @keyframes sh{to{background-position:-200% 0}}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;
         background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;
         transition:.25s;pointer-events:none;z-index:10;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=date]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
  .body p { white-space: pre-line; }
  .install{display:none;margin:0 0 18px;padding:14px 16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);
           font-size:14px;line-height:1.6;color:var(--ink);align-items:center;gap:10px}
  .install.on{display:flex}
  .install b{color:var(--accent)}
  .install .ib{margin-left:auto;flex:none;height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:var(--paper);font:700 14px "Noto Sans KR",sans-serif;cursor:pointer}
  .install .ix{flex:none;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
  .offline{font-size:12px;color:var(--muted);text-align:center;margin:-8px 0 14px}
  /* ===== 설치 안내 시트 ===== */
  .sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(20,14,8,.45);display:none}
  .sheet-bg.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;background:var(--paper);
         border-radius:22px 22px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));
         transform:translateY(calc(100% + 160px));transition:transform .3s ease;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .sheet.on{transform:none}
  .sheet.lift{bottom:calc(64px + env(safe-area-inset-bottom));border-radius:22px;left:10px;right:10px;padding-bottom:20px}
  .sheet.top{top:0;bottom:auto;border-radius:0 0 22px 22px;transform:translateY(-105%);padding-top:calc(22px + env(safe-area-inset-top))}
  .sheet.top.on{transform:none}
  .sheet h3{margin:0 0 4px;font-size:19px}
  .sheet .sub{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
  .step{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.55}
  .step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--paper);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .step .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#2f7cf6}
  .step b{color:var(--accent)}
  .sheet .row{display:flex;gap:8px;margin-top:14px}
  .sheet .row .btn{height:44px;white-space:nowrap}
  .arrow{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));z-index:32;transform:translateX(-50%);display:none;
         flex-direction:column;align-items:center;color:#fff;font:700 13px "Noto Sans KR",sans-serif;text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
  .arrow.on{display:flex;animation:bob 1.1s ease-in-out infinite}
  .arrow svg{width:34px;height:34px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
  .howto{display:inline-block;margin-top:10px;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
  /* ===== 유튜브 영상 카드 ===== */
  .vids{margin:26px 0 8px}
  .vids .vh{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-align:center;margin-bottom:10px}
  .vcard{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--paper);border:1px solid var(--line);
         color:var(--ink);text-decoration:none;margin-bottom:10px;text-align:left}
  .vcard .th{position:relative;flex:none;width:128px;height:72px;border-radius:9px;overflow:hidden;background:#000}
  .vcard .th img{width:100%;height:100%;object-fit:cover;display:block}
  .vcard .th i{position:absolute;inset:0;margin:auto;width:34px;height:24px;border-radius:7px;background:#ff0033;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:11px}
  .vcard .vt{min-width:0;display:flex;flex-direction:column;gap:3px}
  .vcard small{font-size:12px;font-weight:700;color:var(--accent)}
  .vcard b{font-size:14px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vcard.pl .th{display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-size:26px}
  .toast{bottom:calc(132px + env(safe-area-inset-bottom)) !important}
  /* ===== 하이라이트 ===== */
  mark.hl{background:rgba(255,206,84,.55);color:inherit;border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer}
  @media (prefers-color-scheme: dark){ mark.hl{background:rgba(224,163,108,.45)} }
  .hlbar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:12;display:none;justify-content:center;gap:8px;padding:0 14px;pointer-events:none}
  .hlbar.on{display:flex}
  .hlbar button{pointer-events:auto;height:42px;padding:0 16px;border-radius:99px;border:0;font:700 14px "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
                box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;-webkit-user-select:none;user-select:none}
  .hlbar .y{background:#ffce54;color:#3b2a10}
  .hlbar .d{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  /* ===== 장 전체 보기 ===== */
  h1.linked{cursor:pointer}
  h1.linked .more{display:block;text-decoration:none;margin-top:6px;font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.02em}
  .chap-back{display:inline-flex;align-items:center;gap:4px;margin:0 0 14px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;cursor:pointer}
  .cv{font-size:calc(var(--fs) + 1px);line-height:1.9;margin:0 0 .55em;text-align:left; letter-spacing:normal; word-spacing:normal;word-break:keep-all;overflow-wrap:break-word}
  .cv sup{font-size:.62em;color:var(--accent);font-weight:700;margin-right:6px;vertical-align:.45em}
  .cv.on{background:var(--accent-soft);border-radius:10px;padding:6px 12px;margin-left:-12px;margin-right:-12px}
  .chap-nav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 8px}
  .chap-nav button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;cursor:pointer}
  .chap-nav button:disabled{opacity:.35}
  body.chapter #hlbar{display:none !important}
  .gae{display:flex;width:fit-content;align-items:center;gap:4px;margin:-8px auto 22px;padding:8px 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}
  .gae.wide{width:auto;justify-content:center;margin:4px 0 14px;height:44px;border-radius:12px}
  /* ===== 로그인 + 나의 묵상 ===== */
  .note{margin:0 0 26px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px}
  .note .t{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:10px;text-align:center}
  .note textarea{display:block;width:100%;min-height:130px;resize:none;overflow:hidden;border:0;outline:0;background:transparent;color:var(--ink);font-size:var(--fs);line-height:1.85;padding:0}
  .note textarea::placeholder{color:var(--muted)}
  .note .nf{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
  .note .nf .sp{flex:1}
  .note .nf button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 13px;font-size:12px;cursor:pointer}
  .note .nf button.save{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
  .note .who{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .note .who button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:0}
  .note.login{text-align:center;padding:20px 18px}
  .note.login p{margin:0 0 14px;font-size:14px;line-height:1.7;color:var(--ink)}
  .note .lf{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:0 auto}
  .note .lf input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font-size:16px;outline:0}
  .note .lf input:focus{border-color:var(--accent)}
  .note .lb{display:flex;gap:8px;max-width:300px;margin:10px auto 0}
  .note .lb .btn{height:44px;font-size:14px;white-space:nowrap}
  .note .lmsg{min-height:18px;margin-top:8px;font-size:13px;color:var(--accent)}
  .note .priv{margin:12px 0 0;font-size:11px;line-height:1.6;color:var(--muted)}
  body.typing #hlbar{display:none !important}
  /* 가운데 정렬 */
  .ref, h1 { text-align:center; }
  .verse { text-align:left; letter-spacing:normal; word-spacing:normal; word-break:keep-all; overflow-wrap:break-word; line-break:strict; font-size:var(--fs) !important; }
  .verses { padding:16px 16px 16px 18px !important; }
  .body p { text-align:left; letter-spacing:normal; word-spacing:normal; text-indent:.6em; word-break:keep-all; overflow-wrap:break-word; line-break:strict; }
  .question { text-align:center; }
  /* ===== 글꼴: 맑은 고딕 / 본문 좌우 여백 ===== */
  body, body *:not(svg):not(path) { font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif !important; }
  main.wrap { padding-left:30px; padding-right:30px; max-width:640px; }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <button class="nav" id="prev" aria-label="전날">‹</button>
    <div class="when" id="when" title="날짜 선택">
      <small>READING BIBLE</small>
      <b id="dateLabel">…</b>
    </div>
    <button class="nav" id="next" aria-label="다음날">›</button>
    <input type="date" id="picker">
  </div>
</header>

<div class="wrap" style="padding-top:16px"><div class="install" id="install"></div></div>
<main class="wrap" id="main" style="padding-top:6px"></main>

<div class="dock">
  <div class="wrap">
    <button class="btn sm" id="smaller" aria-label="글자 작게">가−</button>
    <button class="btn sm" id="bigger" aria-label="글자 크게">가+</button>
    <button class="btn primary" id="copy" disabled>묵상 글 복사</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="hlbar" id="hlbar"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="arrow" id="arrow"><span>여기 공유 버튼</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg></div>

<script>
  var DAYS = ['일','월','화','수','목','금','토'];
  var cache = {};
  var current = null, currentData = null, todayStr = null;

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function kstToday(){
    var d = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function shift(ds, n){
    var p = ds.split('-').map(Number), d = new Date(p[0], p[1]-1, p[2] + n);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function human(ds){
    var p = ds.split('-').map(Number), d = new Date(p[0], p[1]-1, p[2]);
    return p[1] + '월 ' + p[2] + '일 ' + DAYS[d.getDay()] + '요일';
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* 글자 크기 */
  var fs = 18;
  try { fs = Number(localStorage.getItem('rb_fs')) || 18; } catch(e){}
  function applyFs(){ document.documentElement.style.setProperty('--fs', fs + 'px'); try{ localStorage.setItem('rb_fs', fs); }catch(e){} }
  applyFs();
  document.getElementById('smaller').onclick = function(){ fs = Math.max(14, fs - 1); applyFs(); };
  document.getElementById('bigger').onclick  = function(){ fs = Math.min(26, fs + 1); applyFs(); };

  /* 화면 그리기 */
  function renderLoading(){
    document.getElementById('main').innerHTML =
      '<div class="skel" style="width:30%"></div><div class="skel" style="height:30px;width:70%"></div>' +
      '<div class="skel" style="height:90px;margin:22px 0 30px"></div>' +
      Array(8).join('<div class="skel"></div>');
  }
  /* 유튜브 더빙·애니메이션 카드 */
  function videoSection(v){
    if (!v || !v.links) return '';
    var kinds = [['dub','🎧 리딩바이블 더빙'],['anim','🎬 리딩바이블 애니메이션']];
    return '<section class="vids"><div class="vh">영상으로 보기</div>' + kinds.map(function(k){
      var it = v[k[0]];
      if (it && it.id) {
        return '<a class="vcard" href="https://www.youtube.com/watch?v=' + encodeURIComponent(it.id) + '" target="_blank" rel="noopener">' +
          '<span class="th"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + encodeURIComponent(it.id) + '/mqdefault.jpg"><i>▶</i></span>' +
          '<span class="vt"><small>' + k[1] + '</small><b>' + esc(it.title) + '</b></span></a>';
      }
      return '<a class="vcard pl" href="' + esc(v.links[k[0]]) + '" target="_blank" rel="noopener"><span class="th">▶</span>' +
        '<span class="vt"><small>' + k[1] + '</small><b>이 날짜 영상은 아직 없어요 · 재생목록 바로가기</b></span></a>';
    }).join('') + '</section>';
  }
  function render(r){
    var m = document.getElementById('main');
    currentData = r && r.ok ? r : null;
    document.getElementById('copy').disabled = !currentData;
    if (!r || !r.ok){
      m.innerHTML = '<div class="state"><div class="big">📖</div>' + esc(r ? r.message : '자료를 불러오지 못했어요.') +
        '<br><br><button class="btn" style="max-width:200px" onclick="go(todayStr)">오늘 자료 보기</button></div>' + videoSection(r && r.videos);
      return;
    }
    var h = (r.offline ? '<p class="offline">오프라인 — 저장해 둔 자료를 보여드려요</p>' : '') + '<p class="ref">오늘의 리딩바이블</p><h1>' + esc(r.passage || r.title) + '</h1>';
    if (r.verses.length){
      h += '<section class="verses">' + r.verses.map(function(v){
        return '<p class="verse"><sup>' + esc(v.n) + '</sup>' + esc(v.t) + '</p>';
      }).join('') + '</section>';
    }
    h += '<section class="body">' + r.body.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</section>';
    if (r.question){
      h += '<div class="divider">묵 상</div><section class="question"><div class="tag">오늘의 질문</div><p>' + esc(r.question) + '</p></section>';
    }
    h += videoSection(r.videos);
    if (r.files.length){
      h += '<div class="files">' + r.files.map(function(f){
        var ext = (f.name.split('.').pop() || '').toUpperCase();
        return '<a class="chip" href="' + esc(f.url) + '" target="_blank" rel="noopener">⬇ ' + esc(ext || '파일') + '</a>';
      }).join('') + '</div>';
    }
    h += '<div class="src">출처: <a href="' + esc(r.url) + '" target="_blank" rel="noopener">새중앙침례교회 자유게시판 원문</a>' + (standalone ? '' : '<br><button class="howto" onclick="showGuide(true)">📲 홈 화면에 앱으로 설치하는 방법</button>') + '</div>';
    m.innerHTML = h;
  }

  /* 날짜 이동 */
  function setHeader(ds){
    document.getElementById('dateLabel').innerHTML = esc(human(ds)) + (ds === todayStr ? '<span class="today-pill">오늘</span>' : '');
    document.getElementById('picker').value = ds;
  }
  /* ===== 자료 불러오기: 구글 앱스 스크립트 API + 기기에 저장(오프라인) ===== */
  var API_URL = 'https://script.google.com/macros/s/AKfycbyDUJi7nVGko-jWkWF7RBv3oRxoW-wJXd4diBg6Z1fJIDxHgMQKDrsvEkvnqiJxKAeg/exec';   // ← 앱스 스크립트 웹앱 주소(…/exec)
  function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
  function load(ds, cb, quiet){
    if (cache[ds]) return cb(cache[ds]);
    var saved = store('rb_day_' + ds);
    fetch(API_URL + '?api=day&d=' + encodeURIComponent(ds), { redirect:'follow' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(r){ if (r && r.ok) { cache[ds] = r; store('rb_day_' + ds, r); } cb(r); })
      .catch(function(){
        if (saved) { saved.offline = true; cache[ds] = saved; return cb(saved); }
        cb({ ok:false, message:'인터넷에 연결되어 있지 않거나 자료를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.' });
      });
  }
  function go(ds){
    current = ds; setHeader(ds); window.scrollTo(0, 0);
    if (!cache[ds]) renderLoading();
    load(ds, function(r){
      if (current !== ds) return;
      render(r);
      [shift(ds, 1), shift(ds, -1)].forEach(function(n){ load(n, function(){}); }); // 앞뒤 날짜 미리 받아두기
    });
  }
  document.getElementById('prev').onclick = function(){ go(shift(current, -1)); };
  document.getElementById('next').onclick = function(){ go(shift(current, 1)); };
  document.getElementById('when').onclick = function(){
    var p = document.getElementById('picker');
    if (p.showPicker) { try { p.showPicker(); return; } catch(e){} }
    go(todayStr);
  };
  document.getElementById('picker').onchange = function(e){ if (e.target.value) go(e.target.value); };

  /* 좌우 스와이프로 날짜 이동 */
  var sx = null, sy = null;
  document.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (sx === null) return;
    var _sel = window.getSelection(); if (_sel && !_sel.isCollapsed) { sx = null; return; }
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) { if (!(window.rbChapterStep && window.rbChapterStep(dx < 0 ? 1 : -1))) go(shift(current, dx < 0 ? 1 : -1)); }
    sx = null;
  }, {passive:true});

  /* 복사용 글: 문단마다 빈 줄, 괄호 밖 구절 범위의 "-"는 "절에서 "로 */
  function convertRange(s){
    return s.split(/(\([^)]*\))/).map(function(seg){
      return seg.charAt(0) === '(' ? seg : seg.replace(/(\d+)\s*[-–~]\s*(\d+)/g, '$1절에서 $2');
    }).join('');
  }
  function postText(r){
    var lines = [];
    lines.push(r.title || ('리딩바이블 (' + r.label + ')'));
    if (r.passage) lines.push('오늘의 리딩바이블: ' + r.passage);
    if (r.verses.length) lines.push(r.verses.map(function(v){ return v.n + '. ' + v.t; }).join('\n'));
    r.body.forEach(function(p){ lines.push(p); });
    if (r.question) lines.push('오늘의 질문: ' + r.question);
    return convertRange(lines.join('\n\n'));
  }
  function toast(msg){
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 1800);
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta); return ok;
  }
  document.getElementById('copy').onclick = function(){
    if (!currentData) return;
    var text = postText(currentData);
    var done = function(){ toast('복사했어요. 붙여넣기 하면 돼요 ✓'); };
    if (fallbackCopy(text)) return done();
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function(){ toast('복사가 막혔어요. 원문에서 복사해 주세요.'); });
    else toast('복사가 막혔어요. 원문에서 복사해 주세요.');
  };

  /* ===== 앱 설치 안내 ===== */
  var ua = navigator.userAgent;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isIPad = /ipad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  var isKakao = /KAKAOTALK/i.test(ua);
  var inApp = isKakao || /NAVER\(inapp|BAND\/|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|whale\/.*inapp/i.test(ua);
  var isIOSChrome = /CriOS/i.test(ua), isIOSOther = /FxiOS|EdgiOS|NAVER|whale/i.test(ua) && !inApp;
  var ib = document.getElementById('install'), deferred = null;
  var sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg'), arrow = document.getElementById('arrow');
  function getFlag(k){ try { return localStorage.getItem(k) === '1'; } catch(e){ return false; } }
  function setFlag(k){ try { localStorage.setItem(k, '1'); } catch(e){} }
  function hideInstall(){ ib.classList.remove('on'); setFlag('rb_install_hide'); }
  var ICON = {
    share: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
    plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>',
    more: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    ok: '<span style="font:700 15px Noto Sans KR,sans-serif">추가</span>',
    out: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>'
  };
  function step(n, icon, html){ return '<div class="step"><span class="n">' + n + '</span><span class="ic">' + icon + '</span><span>' + html + '</span></div>'; }
  function closeGuide(){ sheet.classList.remove('on'); sheetBg.classList.remove('on'); arrow.classList.remove('on'); }
  sheetBg.onclick = closeGuide;
  function openSheet(html, top, showArrow){
    sheet.className = 'sheet' + (top ? ' top' : '') + (showArrow ? ' lift' : ''); sheet.innerHTML = html;
    sheetBg.classList.add('on'); requestAnimationFrame(function(){ sheet.classList.add('on'); });
    if (showArrow) setTimeout(function(){ arrow.classList.add('on'); }, 350);
  }
  function inAppGuide(){
    var url = location.href.split('#')[0];
    var html = '<h3>브라우저에서 열어 주세요</h3><p class="sub">' + (isKakao ? '카카오톡' : '이 앱') + ' 안에서는 홈 화면에 설치할 수 없어요. ' + (isIOS ? '사파리' : '크롬') + '에서 열면 설치할 수 있어요.</p>';
    if (isKakao) {
      html += '<div class="row"><button class="btn primary" id="gOpen">' + (isIOS ? '사파리' : '브라우저') + '로 열기</button></div>';
    } else if (isAndroid) {
      html += '<div class="row"><button class="btn primary" id="gOpen">크롬으로 열기</button></div>';
    } else {
      html += step(1, ICON.more, '오른쪽 아래(또는 위) <b>··· 메뉴</b>를 누르세요') + step(2, ICON.out, '<b>Safari로 열기</b> 또는 <b>다른 브라우저로 열기</b>를 고르세요');
      html += '<div class="row"><button class="btn" id="gCopy">주소 복사하기</button><button class="btn primary" id="gClose">알겠어요</button></div>';
    }
    openSheet(html, false, false);
    var o = document.getElementById('gOpen'), c = document.getElementById('gCopy'), x = document.getElementById('gClose');
    if (o) o.onclick = function(){
      if (isKakao) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
      else location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    };
    if (c) c.onclick = function(){ if (fallbackCopy(url)) toast('주소를 복사했어요. 사파리에 붙여넣어 주세요'); };
    if (x) x.onclick = closeGuide;
  }
  function iosGuide(){
    var where = isIOSChrome ? '주소창 오른쪽의 <b>공유 버튼</b>' : (isIPad ? '화면 <b>위쪽 오른편</b>의 <b>공유 버튼</b>' : '화면 <b>아래 가운데</b>의 <b>공유 버튼</b>');
    var html = '<h3>홈 화면에 앱 추가하기</h3><p class="sub">한 번만 해 두면 다음부터 아이콘을 눌러 앱처럼 바로 열 수 있어요.</p>' +
      step(1, ICON.share, where + '을 누르세요.<br><span style="color:var(--muted);font-size:13px">안 보이면 <b>··· 버튼</b>을 먼저 누르거나 화면을 살짝 위로 올려 주세요.</span>') +
      step(2, ICON.plus, '메뉴를 아래로 내려 <b>홈 화면에 추가</b>를 누르세요.') +
      step(3, ICON.ok, '오른쪽 위 <b>추가</b>를 누르면 끝이에요!') +
      '<div class="row"><button class="btn" id="gNever">그만 보기</button><button class="btn primary" id="gClose">알겠어요</button></div>';
    openSheet(html, false, !isIPad && !isIOSChrome);
    document.getElementById('gClose').onclick = closeGuide;
    document.getElementById('gNever').onclick = function(){ setFlag('rb_guide_never'); closeGuide(); };
  }
  function androidGuide(){
    var html = '<h3>홈 화면에 앱 추가하기</h3><p class="sub">한 번만 해 두면 아이콘을 눌러 앱처럼 바로 열 수 있어요.</p>' +
      step(1, ICON.more, '오른쪽 위 <b>⋮ 메뉴</b>를 누르세요. (삼성 인터넷은 아래 <b>≡ 메뉴</b>)') +
      step(2, ICON.plus, '<b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요.') +
      step(3, ICON.ok, '<b>설치</b> 또는 <b>추가</b>를 누르면 끝이에요!') +
      '<div class="row"><button class="btn primary" id="gClose">알겠어요</button></div>';
    openSheet(html, false, false);
    document.getElementById('gClose').onclick = closeGuide;
  }
  window.showGuide = function(force){
    if (inApp) return inAppGuide();
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function(){ deferred = null; hideInstall(); }); return; }
    if (isIOS) return iosGuide();
    if (isAndroid) return androidGuide();
    if (force) toast('휴대폰에서 열면 홈 화면에 설치할 수 있어요');
  };
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    if (standalone || getFlag('rb_install_hide')) return;
    ib.innerHTML = '<span>📲 <b>홈 화면에 설치</b>하면 앱처럼 바로 열 수 있어요.</span><button class="ib" id="ibgo">설치</button><button class="ix" id="ibx" aria-label="닫기">×</button>';
    ib.classList.add('on');
    document.getElementById('ibgo').onclick = function(){ window.showGuide(true); };
    document.getElementById('ibx').onclick = hideInstall;
  });
  window.addEventListener('appinstalled', function(){ hideInstall(); toast('설치됐어요! 홈 화면의 아이콘으로 열어 보세요'); });
  if (!standalone) {
    if (inApp) {
      ib.innerHTML = '<span>📲 ' + (isKakao ? '카카오톡' : '이 앱') + ' 안에서는 설치가 안 돼요. <b>브라우저로 열어</b> 설치해 주세요.</span><button class="ib" id="ibgo">방법 보기</button>';
      ib.classList.add('on'); document.getElementById('ibgo').onclick = inAppGuide;
      if (!getFlag('rb_inapp_seen')) { setFlag('rb_inapp_seen'); setTimeout(inAppGuide, 1200); }
    } else if (isIOS && !getFlag('rb_install_hide')) {
      ib.innerHTML = '<span>📲 <b>홈 화면에 추가</b>하면 앱처럼 쓸 수 있어요.</span><button class="ib" id="ibgo">방법 보기</button><button class="ix" id="ibx" aria-label="닫기">×</button>';
      ib.classList.add('on');
      document.getElementById('ibgo').onclick = iosGuide;
      document.getElementById('ibx').onclick = hideInstall;
      if (!getFlag('rb_guide_never') && !getFlag('rb_guide_seen')) { setFlag('rb_guide_seen'); setTimeout(iosGuide, 1500); }
    }
  }
  if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

  todayStr = kstToday();
  go(todayStr);
</script>

<script>
/* ===================== 하이라이트 ===================== */
(function(){
  var bar = document.getElementById('hlbar'), lastRange = null, activeMark = null;
  function key(){ return 'rb_hl_' + current; }
  function load(){ try { return JSON.parse(localStorage.getItem(key()) || '[]'); } catch(e){ return []; } }
  function save(list){ try { localStorage.setItem(key(), JSON.stringify(list)); } catch(e){} }

  /* 하이라이트할 수 있는 칸: 말씀(v), 해설 문단(b), 오늘의 질문(q) */
  function containers(){
    var out = [];
    document.querySelectorAll('#main .verse').forEach(function(p, i){
      var span = p.querySelector('.hlc');
      if (!span) {
        span = document.createElement('span'); span.className = 'hlc';
        Array.prototype.slice.call(p.childNodes).forEach(function(n){ if (!(n.nodeType === 1 && n.tagName === 'SUP')) span.appendChild(n); });
        p.appendChild(span);
      }
      span.dataset.k = 'v' + i; out.push(span);
    });
    document.querySelectorAll('#main .body p').forEach(function(p, i){ p.dataset.k = 'b' + i; out.push(p); });
    var q = document.querySelector('#main .question p'); if (q) { q.dataset.k = 'q'; out.push(q); }
    return out;
  }
  function esc2(t){ return t.replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function paint(){
    var list = load(), byK = {};
    list.forEach(function(h, i){ (byK[h.k] = byK[h.k] || []).push({ s:h.s, e:h.e, i:i }); });
    containers().forEach(function(c){
      var text = c.textContent, hs = (byK[c.dataset.k] || []).sort(function(a, b){ return a.s - b.s; });
      var html = '', pos = 0;
      hs.forEach(function(h){
        var s0 = Math.max(h.s, pos), e0 = Math.min(h.e, text.length);
        if (e0 <= s0) return;
        html += esc2(text.slice(pos, s0)) + '<mark class="hl" data-i="' + h.i + '">' + esc2(text.slice(s0, e0)) + '</mark>';
        pos = e0;
      });
      html += esc2(text.slice(pos));
      c.innerHTML = html;
    });
    showBar();
  }
  function offsetIn(c, node, off){
    var r = document.createRange(); r.selectNodeContents(c); r.setEnd(node, off); return r.toString().length;
  }
  function addFromRange(range){
    var list = load(), added = 0;
    containers().forEach(function(c){
      if (!range.intersectsNode(c)) return;
      var len = c.textContent.length;
      var s = c.contains(range.startContainer) ? offsetIn(c, range.startContainer, range.startOffset) : 0;
      var e = c.contains(range.endContainer) ? offsetIn(c, range.endContainer, range.endOffset) : len;
      var t = c.textContent;
      while (s < e && /\s/.test(t[s])) s++;
      while (e > s && /\s/.test(t[e - 1])) e--;
      if (e <= s) return;
      /* 겹치는 하이라이트는 하나로 합치기 */
      list = list.filter(function(h){
        if (h.k !== c.dataset.k || h.e < s || h.s > e) return true;
        s = Math.min(s, h.s); e = Math.max(e, h.e); return false;
      });
      list.push({ k: c.dataset.k, s: s, e: e });
      added++;
    });
    if (added) { save(list); paint(); toast('하이라이트했어요 🖍'); }
  }
  function order(k){ var t = k[0], n = Number(k.slice(1)) || 0; return ({ v:0, b:1000, q:2000 })[t] + n; }
  function copyHighlights(){
    var list = load().slice().sort(function(a, b){ return order(a.k) - order(b.k) || a.s - b.s; });
    if (!list.length) return;
    var texts = {}; containers().forEach(function(c){ texts[c.dataset.k] = c.textContent; });
    var parts = list.map(function(h){ return (texts[h.k] || '').slice(h.s, h.e); }).filter(Boolean);
    var p = current.split('-').map(Number);
    var head = '리딩바이블 (' + p[0] + '년 ' + p[1] + '월 ' + p[2] + '일)';
    if (currentData && currentData.passage) head += '\n' + currentData.passage;
    var out = convertRange(head + '\n\n' + parts.join('\n\n'));
    if (fallbackCopy(out)) toast('하이라이트 ' + parts.length + '개를 복사했어요 ✓');
    else if (navigator.clipboard) navigator.clipboard.writeText(out).then(function(){ toast('하이라이트 ' + parts.length + '개를 복사했어요 ✓'); });
  }
  function btn(cls, label, fn){
    var b = document.createElement('button'); b.className = cls; b.textContent = label;
    /* 버튼을 눌러도 선택이 풀리지 않도록 */
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('touchstart', function(e){ e.preventDefault(); fn(); }, { passive:false });
    b.addEventListener('click', fn);
    return b;
  }
  function showBar(){
    bar.innerHTML = '';
    var sel = window.getSelection(), hasSel = sel && !sel.isCollapsed && lastRange;
    if (activeMark) {
      var i = Number(activeMark.dataset.i);
      bar.appendChild(btn('d', '이 하이라이트 지우기', function(){
        var list = load(); list.splice(i, 1); save(list); activeMark = null; paint(); toast('지웠어요');
      }));
      bar.appendChild(btn('d', '취소', function(){ activeMark = null; showBar(); }));
    } else if (hasSel) {
      bar.appendChild(btn('y', '🖍 하이라이트', function(){
        var r = lastRange; lastRange = null;
        try { window.getSelection().removeAllRanges(); } catch(e){}
        if (r) addFromRange(r);
      }));
    } else {
      var n = currentData ? load().length : 0;
      if (n) {
        bar.appendChild(btn('y', '🖍 하이라이트만 복사 (' + n + ')', copyHighlights));
        bar.appendChild(btn('d', '모두 지우기', function(){
          if (bar.dataset.confirm === '1') { save([]); bar.dataset.confirm = ''; paint(); toast('이 날짜 하이라이트를 모두 지웠어요'); }
          else { bar.dataset.confirm = '1'; toast('한 번 더 누르면 모두 지워져요'); setTimeout(function(){ bar.dataset.confirm = ''; }, 2500); }
        }));
      }
    }
    bar.classList.toggle('on', bar.children.length > 0);
  }
  document.addEventListener('selectionchange', function(){
    var sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.rangeCount) {
      var r = sel.getRangeAt(0), main = document.getElementById('main');
      var ae = document.activeElement;
      if (ae && ae.tagName === 'TEXTAREA') return;
      if (main.contains(r.commonAncestorContainer)) { lastRange = r.cloneRange(); activeMark = null; }
    } else { setTimeout(function(){ var s = window.getSelection(); if (!s || s.isCollapsed) lastRange = null; showBar(); }, 250); return; }
    showBar();
  });
  document.getElementById('main').addEventListener('click', function(e){
    var m = e.target.closest && e.target.closest('mark.hl');
    var sel = window.getSelection();
    if (m && (!sel || sel.isCollapsed)) { activeMark = m; showBar(); }
    else if (activeMark) { activeMark = null; showBar(); }
  });
  /* 화면이 새로 그려질 때마다 하이라이트 다시 칠하기 */
  var _render = render;
  render = function(r){ activeMark = null; lastRange = null; _render(r); if (r && r.ok) paint(); else showBar(); };
})();
</script>

<script>
/* ===================== 장 전체 보기 (개역한글) ===================== */
(function(){
  var BOOKS = ["창세기", "출애굽기", "레위기", "민수기", "신명기", "여호수아", "사사기", "룻기", "사무엘상", "사무엘하", "열왕기상", "열왕기하", "역대상", "역대하", "에스라", "느헤미야", "에스더", "욥기", "시편", "잠언", "전도서", "아가", "이사야", "예레미야", "예레미야애가", "에스겔", "다니엘", "호세아", "요엘", "아모스", "오바댜", "요나", "미가", "나훔", "하박국", "스바냐", "학개", "스가랴", "말라기", "마태복음", "마가복음", "누가복음", "요한복음", "사도행전", "로마서", "고린도전서", "고린도후서", "갈라디아서", "에베소서", "빌립보서", "골로새서", "데살로니가전서", "데살로니가후서", "디모데전서", "디모데후서", "디도서", "빌레몬서", "히브리서", "야고보서", "베드로전서", "베드로후서", "요한일서", "요한이서", "요한삼서", "유다서", "요한계시록"];
  var BSK = 'gen,exo,lev,num,deu,jos,jdg,rut,1sa,2sa,1ki,2ki,1ch,2ch,ezr,neh,est,job,psa,pro,ecc,sng,isa,jer,lam,ezk,dan,hos,jol,amo,oba,jnh,mic,nam,hab,zep,hag,zec,mal,mat,mrk,luk,jhn,act,rom,1co,2co,gal,eph,php,col,1th,2th,1ti,2ti,tit,phm,heb,jas,1pe,2pe,1jn,2jn,3jn,jud,rev'.split(',');
  function gaeUrl(book, ch){ return 'https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=' + BSK[book - 1] + '&chap=' + ch; }
  var byLen = BOOKS.map(function(n, i){ return { n:n, i:i + 1 }; }).sort(function(a, b){ return b.n.length - a.n.length; });
  var cacheB = {}, chap = null;

  /* "예레미야 44장 18, 23절" → { book:24, ch:44, verses:[18,23] } */
  function parseRef(t){
    t = String(t || '').trim();
    var b = null;
    for (var k = 0; k < byLen.length; k++) if (t.indexOf(byLen[k].n) === 0) { b = byLen[k]; break; }
    if (!b) return null;
    var m = t.slice(b.n.length).match(/^\s*(\d+)\s*[장편]\s*(.*)$/);
    if (!m) return null;
    var vs = [];
    m[2].replace(/절/g, '').split(/[,，]/).forEach(function(part){
      var r = part.trim().match(/^(\d+)\s*(?:[-–~]\s*(\d+))?$/);
      if (!r) return;
      var a = Number(r[1]), z = r[2] ? Number(r[2]) : a;
      for (var v = a; v <= z && v - a < 200; v++) vs.push(v);
    });
    return { book: b.i, name: b.n, ch: Number(m[1]), verses: vs };
  }
  function loadBook(n){
    if (cacheB[n]) return Promise.resolve(cacheB[n]);
    return fetch('bible/' + n + '.json').then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ cacheB[n] = j; return j; });
  }
  function showChapter(book, ch, verses){
    chap = { book: book, ch: ch, verses: verses || [] };
    document.body.classList.add('chapter');
    var m = document.getElementById('main');
    m.innerHTML = '<div class="st">불러오는 중…</div>';
    document.getElementById('copy').disabled = true;
    window.scrollTo(0, 0);
    loadBook(book).then(function(B){
      if (!chap || chap.book !== book || chap.ch !== ch) return;
      var vs = B.chapters[ch - 1] || [], on = {};
      chap.verses.forEach(function(v){ on[v] = 1; });
      var h = '<button class="chap-back" id="chapBack">‹ 오늘 묵상으로</button>' +
        '<p class="ref">개역한글</p><h1>' + esc(B.name + ' ' + ch + (book === 19 ? '편' : '장')) + '</h1>' +
        '<a class="gae" href="' + gaeUrl(book, ch) + '" target="_blank" rel="noopener">개역개정으로 보기 (대한성서공회) ↗</a>' +
        vs.map(function(t, i){ return t ? '<p class="cv' + (on[i + 1] ? ' on' : '') + '" id="cv' + (i + 1) + '"><sup>' + (i + 1) + '</sup>' + esc(t) + '</p>' : ''; }).join('') +
        '<div class="chap-nav"><button id="chapPrev"' + (ch <= 1 ? ' disabled' : '') + '>‹ ' + (ch - 1) + (book === 19 ? '편' : '장') + '</button>' +
        '<button id="chapNext"' + (ch >= B.chapters.length ? ' disabled' : '') + '>' + (ch + 1) + (book === 19 ? '편' : '장') + ' ›</button></div>' +
        '<a class="gae wide" href="' + gaeUrl(book, ch) + '" target="_blank" rel="noopener">이 장을 개역개정으로 보기 ↗</a>' +
        '<div class="src">' + esc(B.source) + '</div>';
      m.innerHTML = h;
      document.getElementById('chapBack').onclick = closeChapter;
      document.getElementById('chapPrev').onclick = function(){ openChapter(book, ch - 1, []); };
      document.getElementById('chapNext').onclick = function(){ openChapter(book, ch + 1, []); };
      var first = chap.verses.length ? document.getElementById('cv' + chap.verses[0]) : null;
      if (first) setTimeout(function(){ first.scrollIntoView({ block:'center' }); }, 60);
    }).catch(function(){
      m.innerHTML = '<div class="st">📖<br>성경 본문을 불러오지 못했어요.<br><br><button class="btn" style="max-width:200px" id="chapBack">‹ 오늘 묵상으로</button></div>';
      document.getElementById('chapBack').onclick = closeChapter;
    });
  }
  function openChapter(book, ch, verses){
    var h = 'ch-' + book + '-' + ch + (verses && verses.length ? '-' + verses.join('.') : '');
    if (location.hash.slice(1) === h) showChapter(book, ch, verses); else location.hash = h;
  }
  function closeChapter(){
    if (/^#ch-/.test(location.hash)) {
      if (history.length > 1 && window.__rbFromDay) { history.back(); return; }
      history.replaceState(null, '', location.pathname + location.search);
    }
    leave();
  }
  function leave(){ chap = null; document.body.classList.remove('chapter'); go(current || todayStr); }
  function route(){
    var m = location.hash.match(/^#ch-(\d+)-(\d+)(?:-([\d.]+))?$/);
    if (m) { history.replaceState(null, '', location.pathname + location.search); location.href = gaeUrl(Number(m[1]), Number(m[2])); return; }
    else if (chap) leave();
  }
  window.addEventListener('hashchange', route);
  window.rbChapterMode = function(){ return !!chap; };
  window.rbParseRef = parseRef;
  window.rbChapterStep = function(d){ if (!chap) return false; loadBook(chap.book).then(function(B){ var c = chap.ch + d; if (c >= 1 && c <= B.chapters.length) openChapter(chap.book, c, []); }); return true; };

  /* 묵상 화면 제목(본문 구절)을 누르면 장 전체로 */
  var _render2 = render;
  /* 날짜를 옮기면 장 화면에서 나와 묵상 화면으로 */
  var _go2 = go;
  go = function(ds){
    if (chap) { chap = null; document.body.classList.remove('chapter'); if (/^#ch-/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search); }
    return _go2(ds);
  };
  render = function(r){
    if (chap) return;   /* 장 화면을 보는 중이면 묵상 화면으로 덮어쓰지 않음 */
    _render2(r);
    if (!r || !r.ok) return;
    var ref = parseRef(r.passage), h1 = document.querySelector('#main h1');
    if (!ref || !h1) return;
    h1.classList.add('linked');
    var url = gaeUrl(ref.book, ref.ch);
    h1.insertAdjacentHTML('beforeend', '<a class="more" id="gaeLink" href="' + url + '" target="_blank" rel="noopener">' + esc(ref.name + ' ' + ref.ch + (ref.book === 19 ? '편' : '장')) + ' 전체 보기 · 개역개정 ↗</a>');
    h1.onclick = function(e){ if (e.target.id !== 'gaeLink') document.getElementById('gaeLink').click(); };
  };
  /* 처음 열 때 주소에 #ch-… 가 있으면 바로 장 화면 */
  if (/^#ch-/.test(location.hash)) setTimeout(route, 0);
})();
</script>


<script>
/* ===================== 로그인(이름 + PIN) + 나의 묵상 (구글 시트 저장) ===================== */
(function(){
  var PRIVACY = '작성한 묵상은 관리자의 구글 시트에 저장되며, 관리자가 볼 수 있어요. PIN은 암호화되어 관리자도 알 수 없어요.';
  var user = null, lastR = null;
  try { var u = JSON.parse(localStorage.getItem('rb_user') || 'null'); if (u && u.token && u.exp > Date.now()) user = u; } catch(e){}
  function saveUser(u){ user = u; try { localStorage.setItem('rb_user', JSON.stringify(u)); } catch(e){} }
  function signOut(){ user = null; try { localStorage.removeItem('rb_user'); } catch(e){} remount(); toast('로그아웃했어요'); }

  function api(body){
    return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json(); });
  }
  function label(ds){ var p = ds.split('-').map(Number); return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일'; }
  function grow(t){ t.style.height = 'auto'; t.style.height = Math.max(130, t.scrollHeight) + 'px'; }

  function loginBox(sec){
    sec.className = 'note login';
    sec.innerHTML = '<div class="t">나의 묵상</div><p>로그인하면 오늘의 묵상을 적고<br>저장해 둘 수 있어요.</p>' +
      '<div class="lf"><input id="lid" type="text" maxlength="20" placeholder="이름 (예: 임요한)" autocomplete="username">' +
      '<input id="lpin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="PIN 숫자 4~6자리" autocomplete="current-password"></div>' +
      '<div class="lb"><button type="button" class="btn primary" id="lgo">로그인</button><button type="button" class="btn" id="lnew">처음이면 가입</button></div>' +
      '<div class="lmsg" id="lmsg"></div><div class="priv">' + PRIVACY + '</div>';
    var id = sec.querySelector('#lid'), pin = sec.querySelector('#lpin'), msg = sec.querySelector('#lmsg');
    function go2(action){
      var v = id.value.trim(), p = pin.value.trim();
      if (!v) { msg.textContent = '이름을 입력해 주세요'; id.focus(); return; }
      if (!/^\d{4,6}$/.test(p)) { msg.textContent = 'PIN은 숫자 4~6자리로 입력해 주세요'; pin.focus(); return; }
      msg.textContent = action === 'register' ? '가입하는 중…' : '로그인하는 중…';
      sec.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
      api({ action: action, id: v, pin: p }).then(function(j){
        sec.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
        if (j && j.ok) { saveUser({ id: j.id, token: j.token, exp: j.exp }); toast(j.id + '님, ' + (action === 'register' ? '가입을 환영해요' : '환영해요')); remount(); }
        else msg.textContent = '⚠ ' + ((j && j.message) || '잠시 후 다시 시도해 주세요');
      }).catch(function(){ sec.querySelectorAll('button').forEach(function(b){ b.disabled = false; }); msg.textContent = '⚠ 인터넷 연결을 확인해 주세요'; });
    }
    sec.querySelector('#lgo').onclick = function(){ go2('login'); };
    sec.querySelector('#lnew').onclick = function(){ go2('register'); };
    pin.addEventListener('keydown', function(e){ if (e.key === 'Enter') go2('login'); });
  }

  function mount(r){
    lastR = r;
    var old = document.querySelector('#main .note'); if (old) old.remove();
    var anchor = document.querySelector('#main .question') || document.querySelector('#main .body');
    if (!anchor) return;
    var sec = document.createElement('section');
    anchor.insertAdjacentElement('afterend', sec);
    if (!user || user.exp < Date.now()) { user = null; return loginBox(sec); }

    var ds = current;
    sec.className = 'note';
    sec.innerHTML = '<div class="t">나의 묵상</div>' +
      '<div class="who">' + esc(user.id) + ' 님 · <button type="button" id="gout">로그아웃</button></div>' +
      '<textarea id="note" rows="5" placeholder="오늘 말씀과 질문을 묵상하며 떠오른 생각, 기도, 다짐을 적어 보세요." disabled></textarea>' +
      '<div class="nf"><span id="noteState">불러오는 중…</span><span class="sp"></span><button type="button" id="noteCopy">복사</button><button type="button" class="save" id="noteSave">저장</button></div>' +
      '<div class="priv">' + PRIVACY + '</div>';
    var t = sec.querySelector('#note'), st = sec.querySelector('#noteState'), saved = '', busy = false;
    sec.querySelector('#gout').onclick = signOut;
    function state(){
      if (busy) return;
      var n = t.value.length;
      st.textContent = t.value === saved ? (n ? n.toLocaleString() + '자 · 저장됨 ✓' : '아직 작성하지 않았어요') : n.toLocaleString() + '자 · 저장 안 됨';
    }
    function expired(j){ if (j && j.relogin) { signOut(); toast('다시 로그인해 주세요'); return true; } return false; }
    function save(quiet){
      if (busy || t.value === saved || !user) return;
      busy = true; st.textContent = '저장 중…';
      var text = t.value;
      api({ action: 'note_save', token: user.token, date: ds, text: text }).then(function(j){
        busy = false;
        if (expired(j)) return;
        if (j && j.ok) { saved = text; state(); if (!quiet) toast('구글 시트에 저장했어요 ✓'); }
        else st.textContent = '⚠ 저장하지 못했어요 (' + ((j && j.message) || '오류') + ')';
      }).catch(function(){ busy = false; st.textContent = '⚠ 인터넷 연결을 확인해 주세요'; });
    }
    api({ action: 'note_get', token: user.token, date: ds }).then(function(j){
      if (current !== ds || expired(j)) return;
      t.disabled = false;
      if (j && j.ok) { saved = j.text || ''; t.value = saved; grow(t); state(); }
      else st.textContent = '⚠ 불러오지 못했어요 (' + ((j && j.message) || '오류') + ')';
    }).catch(function(){ t.disabled = false; st.textContent = '⚠ 인터넷 연결을 확인해 주세요'; });
    var idle = null;
    t.addEventListener('input', function(){ grow(t); state(); clearTimeout(idle); idle = setTimeout(function(){ save(true); }, 4000); });
    t.addEventListener('focus', function(){ document.body.classList.add('typing'); });
    t.addEventListener('blur', function(){ document.body.classList.remove('typing'); save(true); });
    sec.querySelector('#noteSave').onclick = function(){ clearTimeout(idle); save(false); };
    sec.querySelector('#noteCopy').onclick = function(){
      if (!t.value.trim()) return toast('아직 적은 묵상이 없어요');
      var head = '리딩바이블 (' + label(ds) + ')' + (r.passage ? '\n' + r.passage : '');
      var out = convertRange(head) + '\n\n' + (r.question ? '오늘의 질문: ' + r.question + '\n\n' : '') + '나의 묵상:\n' + t.value.trim();
      if (fallbackCopy(out)) toast('내 묵상을 복사했어요 ✓');
      else if (navigator.clipboard) navigator.clipboard.writeText(out).then(function(){ toast('내 묵상을 복사했어요 ✓'); });
    };
    window.__rbNoteFlush = function(){ clearTimeout(idle); save(true); };
  }
  function remount(){ if (lastR && document.querySelector('#main .body')) mount(lastR); }

  var _render3 = render;
  render = function(r){
    if (window.__rbNoteFlush) { try { window.__rbNoteFlush(); } catch(e){} window.__rbNoteFlush = null; }
    _render3(r);
    if (r && r.ok && document.querySelector('#main .body')) mount(r);
  };
  window.addEventListener('pagehide', function(){ if (window.__rbNoteFlush) window.__rbNoteFlush(); });
})();
</script>
</body>
